server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/wasm;

  # The landing page itself
  location = / {
    try_files /index.html =404;
  }

  # Hashed build assets
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Any file that exists here (favicon, avatars, robots.txt, sitemap.xml...) is served.
  # Everything else is an old photo-site URL: send it to the same path on frame.byairu.com.
  location / {
    try_files $uri @frame;
  }
  location @frame {
    return 301 https://frame.byairu.com$request_uri;
  }
}
